<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MEDInvenTEC</title>

        <!-- favicon -->
        <link rel="shortcut icon" href="../../../assets/img/Icon.png">

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
    
        <!-- Font Awesome -->
        <link rel="stylesheet" href="../../../assets/fontawesome/all.min.css">

        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="../../../assets/bootstrap/bootstrap.min.css">

        <!-- custom CSS -->
        <link rel="stylesheet" href="../../../assets/css/1240811.css">

    </head>

    <body>
        <!-- Navbar -->
        <header class="container-fluid custom-navbar">
            <div class="row align-items-center h-100">
                <div class="col d-flex align-items-center" >
                    <!-- Logo -->
                    <a href="../../index.html">
                        <img src="../../../assets/img/Imagem 3.jpeg" alt="Logo da empresa" class="logo"> <!-- Clicar no logo vai pro início -->
                    </a>
                </div>

                <!-- Botão para voltar ao menu-->
                <div class="col-auto"> 
                    <button class="custom-button" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
                        <i class="fa-solid fa-bars me-2"></i> Menu
                    </button>
                </div>
            </div>
        </header>

        <!-- Sidebar -->
        <div class="offcanvas offcanvas-end" tabindex="-1" id="sidebarMenu">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <a href="../equipamentos/lista.html" class="sidebar-link">
                    <i class="fas fa-laptop"></i> Equipamentos
                </a>
                <a href="../fornecedores/lista_forn.html" class="sidebar-link">
                    <i class="fas fa-building"></i> Fornecedores
                </a>
            </div>
        </div>

        <!-- Conteúdo Principal -->
            <main class="container-fluid p-4" style="background-color: #fff4fb;">
                <div class="d-flex justify-content-center mt-4">
                    <div class="card w-100 shadow rounded" style="max-width: 1200px;">
                        <div class="card-body">
                            <h2 class="mb-4" style="color: #680447;"><strong><i class="fa-solid fa-pen-to-square me-2"></i> Atualização de Dados EQUIPAMENTOS</strong></h2>
                            <hr>
                            <form action="#" method="post">
                                <!-- Campo código de inventário --> 
                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="codigo_inventario" class="form-label">Código interno <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="codigo_inventario" name="codigo_inventario" value="EQ0001" required>
                                    </div>
                                </div>

                                <!-- Campos Categoria/Grupo e Designação -->
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="categoria_grupo" class="form-label">Categoria / Grupo <span class="text-danger">*</span></label>
                                        <select class="form-control" id="tipo_entrada" name="tipo_entrada" required> 
                                            <option selected disabled>Escolha uma opção</option>
                                            <option value="Suporte de vida">Suporte de vida</option>
                                            <option value="Terapia">Terapia</option>
                                            <option value="Diagnóstico">Diagnóstico</option>
                                            <option value="Laboratório">Laboratório</option>
                                            <option value="Esterilização">Esterilização</option>
                                            <option value="Reabilitação">Reabilitação</option>
                                            <option value="Monitorização" selected>Monitorização</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="designacao_equipamento" class="form-label">Designação <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="designacao_equipamento" name="designacao_equipamento" value="Sensor de temperatura do Monitor multiparamétrico " required>
                                    </div>
                                </div>

                                <!-- Campos Marca, Modelo e Nº série --> 
                                <div class="row mb-3"> 
                                    <div class="col-md-4">
                                        <label for="marca" class="form-label">Marca <span class="text-danger">*</span></label> 
                                        <input type="text" class="form-control" id="marca" name="marca" value="Philips" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="modelo" class="form-label">Modelo <span class="text-danger">*</span></label> 
                                        <input type="text" class="form-control" id="modelo" name="modelo" value="IntelliVue MP5" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="numero-serie" class="form-label">Nº de série <span class="text-danger">*</span></label> 
                                        <input type="text" class="form-control" id="numero-serie" name="numero-serie" value="MP5-2022-45873" required>
                                    </div>
                                </div>

                                <!-- Campo Fabricante -->
                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="fabricante" class="form-label">Fabricante <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="fabricante" name="fabricante" value="Philips Healthcare" required>
                                    </div>
                                </div>

                                <!-- Campo Data de aquisição -->
                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="data_aquisicao" class="form-label">Data de aquisição <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="data_aquisicao" name="data_aquisicao" value="2023-05-19" required>
                                    </div>
                                </div>

                                <!-- Campos Ano de fabrico e custo de aquisição -->
                                <div class="row mb-3"> 
                                    <div class="col-md-6">
                                        <label for="ano_fabrico" class="form-label">Ano de fabrico <span class="text-danger">*</span></label>
                                        <input type="number" class="form-control" id="ano_fabrico" name="ano_fabrico" min="1980" max="2026" value="2022" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="custo_aquisicao" class="form-label">Custo de aquisição (€) <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="custo_aquisicao" name="custo_aquisicao" value="25000" step="0.01" required>
                                    </div>                               
                                </div>

                                <!--Campos Tipo de entrada, Estado atual e Criticidade -->
                                <div class="row mb-3">
                                    <div class="col-md-4">
                                        <label for="tipo_entrada" class="form-label">Entrada por: <span class="text-danger">*</span></label>
                                        <select class="form-control" id="tipo_entrada" name="tipo_entrada" required> 
                                            <option selected disabled>Escolha uma opção</option>
                                            <option value="Doação">Doação</option>
                                            <option value="Aluguer">Aluguer</option>
                                            <option value="Empréstimo">Empréstimo</option>
                                            <option value="Compra" selected>Compra</option>
                                        </select>
                                    </div>     
                                    <div class="col-md-4">
                                        <label for="estado" class="form-label">Estado atual <span class="text-danger">*</span></label>
                                        <select class="form-control" id="estado" name="estado" required> 
                                            <option selected disabled>Escolha uma opção</option>
                                            <option value="Inativo">Inativo</option>
                                            <option value="Calibração">Em calibração</option>
                                            <option value="Quarentena">Em quarentena</option>
                                            <option value="Abatido">Abatido</option>
                                            <option value="Ativo" selected>Ativo</option>
                                        </select>
                                    </div>   
                                    <div class="col-md-4">
                                        <label for="criticidade" class="form-label">Criticidade <span class="text-danger">*</span></label>
                                        <select class="form-control" id="criticidade" name="criticidade" required> 
                                            <option selected disabled>Escolha uma opção</option>
                                            <option value="Baixa">Baixa</option>
                                            <option value="Média">Média</option>
                                            <option value="Alta">Alta</option>
                                            <option value="Suporte de vida" selected>Suporte de vida</option>
                                        </select>
                                    </div>   
                                </div>

                                <!-- Campo Observações -->
                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="observacoes" class="form-label">Observações</label>
                                        <textarea class="form-control" id="observacoes" name="observacoes" rows="4" >Equipamento adquirido por compra em 2023. Encontra-se em pleno funcionamento e sujeito a manutenção preventiva anual.</textarea>
                                    </div>
                                </div>
                                
                                <!-- Botões -->
                                <div class="d-flex justify-content-end gap-2 mb-4">
                                    <a href="lista.html" class="btn btn-outline-secondary">
                                        <i class="fa-solid fa-xmark me-1"></i> Cancelar 
                                    </a>
                                    <button type="submit" class="btn btn-guardar">
                                        <i class="fa-regular fa-floppy-disk me-1"></i> Guardar
                                    </button>
                                </div>

                                <!-- Área de erros -->
                                <div class="alert alert-danger text-center d-none" id="mensagemErro" role="alert"> 
                                    • Erro
                                </div>
                                
                            </form>
                        </div>
                    </div>
                </div>
            </main>

        <!-- Bootstrap JS -->
        <script src="../../../assets/bootstrap/bootstrap.bundle.min.js"></script>
    </body>




</html>
