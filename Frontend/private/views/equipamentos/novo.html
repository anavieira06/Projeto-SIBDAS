<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MEDInvenTEC</title>

        <!-- favicon -->
        <link rel="shortcut icon" href="../../../assets/img/Icon.png">

        <!-- custom CSS -->
        <link rel="stylesheet" href="../../../assets/css/1240811.css">

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
    
        <!-- Font Awesome -->
        <link rel="stylesheet" href="../../../assets/fontawesome/all.min.css">

        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="../../../assets/bootstrap/bootstrap.min.css">

    </head>

    <body>
        <!-- Navbar -->
        <header class="container-fluid custom-navbar">
            <div class="row align-items-center h-100">
                <div class="col d-flex align-items-center" >
                    <!-- Logo -->
                    <a href="../../index.html">
                        <img src="../../../assets/img/Imagem 3.jpeg" alt="Logo da empresa" class="logo"> <!-- Clicar no logo vai pro início -->
                    </a>
                </div>

                <!-- Botão para voltar ao menu-->
                <div class="col-auto"> 
                    <button class="custom-button" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
                        <i class="fa-solid fa-bars me-2"></i> Menu
                    </button>
                </div>
            </div>
        </header>

        <!-- Sidebar -->
        <div class="offcanvas offcanvas-end" tabindex="-1" id="sidebarMenu">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <a href="../equipamentos/lista.html" class="sidebar-link">
                    <i class="fas fa-laptop"></i> Equipamentos
                </a>
            </div>
        </div>

        <!-- Conteúdo Principal -->
            <main class="container-fluid p-4" style="background-color: #fff4fb;">
                <div class="d-flex justify-content-center mt-4">
                    <div class="card w-100 shadow rounded" style="max-width: 1200px;">
                        <div class="card-body">
                            <h2 class="mb-4" style="color: #680447;"><strong><i class="fa-solid fa-plus me-2" style="color: #680447;"></i> Inserir novo equipamento</strong></h2>
                            <hr>
                            <form action="#" method="post" novalidate>
                                <!-- Linhas e colunas com campos organizados --> 
                                <!-- Campo código de inventário --> 
                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="codigo_inventario" class="form-label">Código interno</label>
                                        <input type="text" class="form-control" id="codigo_inventario" name="codigo_inventario" placeholder="Ex: 04.002.04" required>
                                    </div>
                                </div>

                                <!-- Campos Categoria/Grupo e Designação -->
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="categoria_grupo" class="form-label">Categoria / Grupo</label>
                                        <select class="form-control" id="tipo_entrada" name="tipo_entrada" required> 
                                            <option selected disabled>Escolha uma opção</option>
                                            <option value="monitorizaçao">Monitorização</option>
                                            <option value="suporte_vida">Suporte de vida</option>
                                            <option value="terapia">Terapia</option>
                                            <option value="diagnostico">Diagnóstico</option>
                                            <option value="laboratorio">Laboratório</option>
                                            <option value="esterilizaçao">Esterilização</option>
                                            <option value="reabilitaçao">Reabilitação</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="designacao_equipamento" class="form-label">Designação</label>
                                        <input type="text" class="form-control" id="designacao_equipamento" name="designacao_equipamento" placeholder="Ex: Monitor cardíaco" required>
                                    </div>
                                </div>

                                <!-- Campos Marca, Modelo e Nº série --> 
                                <div class="row mb-3"> 
                                    <div class="col-md-4">
                                        <label for="marca" class="form-label">Marca</label> 
                                        <input type="text" class="form-control" id="marca" name="marca" placeholder="Ex: Zoll">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="modelo" class="form-label">Modelo</label> 
                                        <input type="text" class="form-control" id="modelo" name="modelo" placeholder="Ex: Evita V500">
                                    </div>
                                    <div class="col-md-4">
                                        <label for="numero-serie" class="form-label">Nº de série</label> 
                                        <input type="text" class="form-control" id="numero-serie" name="numero-serie" placeholder="Ex: EV500-2021-9934">
                                    </div>
                                </div>

                                <!-- Campo Fabricante -->
                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="fabricante" class="form-label">Fabricante</label>
                                        <input type="text" class="form-control" id="fabricante" name="fabricante" placeholder="Ex: Philips" required>
                                    </div>
                                </div>

                                <!-- Campo Data de aquisição -->
                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="data_aquisicao" class="form-label">Data de aquisição</label>
                                        <input type="date" class="form-control" id="data_aquisicao" name="data_aquisicao" required>
                                    </div>
                                </div>

                                <!-- Campos Ano de fabrico e custo de aquisição -->
                                <div class="row mb-3"> 
                                    <div class="col-md-6">
                                        <label for="ano_fabrico" class="form-label">Ano de fabrico</label>
                                        <input type="number" class="form-control" id="ano_fabrico" name="ano_fabrico" min="1980" max="2026" placeholder="Ex: 2024" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="custo_aquisicao" class="form-label">Custo de aquisição</label>
                                        <input type="text" class="form-control" id="custo_aquisicao" name="custo_aquisicao" placeholder="Ex: 2500" step="0.01" required>
                                    </div>                               
                                </div>

                                <!--Campos Tipo de entrada, Estado atual e Criticidade -->
                                <div class="row mb-3">
                                    <div class="col-md-4">
                                        <label for="tipo_entrada" class="form-label">Entrada por:</label>
                                        <select class="form-control" id="tipo_entrada" name="tipo_entrada" required> 
                                            <option selected disabled>Escolha uma opção</option>
                                            <option value="compra">Compra</option>
                                            <option value="doacao">Doação</option>
                                            <option value="aluguer">Aluguer</option>
                                            <option value="emprestimo">Empréstimo</option>
                                        </select>
                                    </div>     
                                    <div class="col-md-4">
                                        <label for="estado" class="form-label">Estado atual</label>
                                        <select class="form-control" id="estado" name="estado" required> 
                                            <option selected disabled>Escolha uma opção</option>
                                            <option value="ativo">Ativo</option>
                                            <option value="inativo">Inativo</option>
                                            <option value="calibração">Em calibração</option>
                                            <option value="quarentena">Em quarentena</option>
                                            <option value="abatido">Abatido</option>
                                        </select>
                                    </div>   
                                    <div class="col-md-4">
                                        <label for="criticidade" class="form-label">Criticidade</label>
                                        <select class="form-control" id="criticidade" name="criticidade" required> 
                                            <option selected disabled>Escolha uma opção</option>
                                            <option value="baixa">Baixa</option>
                                            <option value="media">Média</option>
                                            <option value="alta">Alta</option>
                                            <option value="suporte_vida">Suporte de vida</option>
                                        </select>
                                    </div>   
                                </div>

                                <!-- Campo Observações -->
                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="observacoes" class="form-label">Observações</label>
                                        <textarea class="form-control" id="observacoes" name="observacoes" rows="4" placeholder="Informações adicionais sobre o equipamento..."></textarea>
                                    </div>
                                </div>

                                <!-- Botões -->
                                <div class="d-flex justify-content-end gap-2 mb-4">
                                    <a href="lista.html" class="btn btn-outline-secondary">
                                        <i class="fa-solid fa-xmark me-1"></i> Cancelar 
                                    </a>
                                    <button type="submit" class="btn btn" style="background-color: #680447; color: #fff;">
                                        <i class="fa-regular fa-floppy-disk me-1"></i> Guardar
                                    </button>
                                </div>
                
                            </form>
                        </div>
                    </div>
                </div>
            </main>

        <!-- Bootstrap JS -->
        <script src="../../../assets/bootstrap/bootstrap.bundle.min.js"></script>
    </body>
</html>
