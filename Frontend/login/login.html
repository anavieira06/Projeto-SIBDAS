<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDInvenTEC</title>
    
    <!-- Bootstrap CSS & custom CSS -->
    <link rel="stylesheet" href="../public/assets/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/1240811.css">
    
    <!-- favicon -->
    <link rel="shortcut icon" href="../assets/img/Icon.png" type="image/png"> 
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="../public/assets/fontawesome/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;700&display=swap" rel="stylesheet">

</head>
<body>
    <!-- Bootstrap JS and custom JS -->
    <script src="assets/bootstrap/bootstrap.bundle.min.js"></script>

    <div class="container-fluid mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-6 col-sm-8 col-10">
                <!-- Card e restante conteúdo -->
                <div class="card p-4">
                    <div class="d-flex align-items-center justify-content-center my-4">
                        <!-- Imagem da empresa -->
                        <img src="../assets/img/Imagem 3.jpeg">
                    </div>

                    <div class="row">
                        <div class="col">
                            <!-- Formulário -->
                            <form action="../private/index.html" method="post">
                                <div class="mb-3">
                                    <!-- Utilizador -->
                                    <label for="email" class="form-label">Utilizador</label>
                                    <input type="email" name="email" id="email" class="form-control">
                                </div>

                                <div class="mb-3">
                                    <!-- Password -->
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" name="password" id="password" class="form-control">
                                </div>

                                <div class="mb-3 text-center">
                                    <!-- Submit -->
                                    <button type="submit" class="btn btn-secondary px-4">
                                        Entrar <i class="fa-solid fa-right-to-bracket ms-2"></i>
                                    </button>
                                </div>

                                <div>
                                    <!-- Erros -->
                                    <div class="alert alert-danger p-2 text-center">
                                        Erro: Utilizador não registado
                                    </div>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
